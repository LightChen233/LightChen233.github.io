<!-- Apply the saved accent theme before first paint to avoid a flash -->
<script>
(function () {
  try {
    var t = localStorage.getItem("qc-theme");
    if (t && t !== "indigo") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
